name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Install the packed tarball and run it
        shell: bash
        run: |
          cd apps/cli
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/install-check" && cd "$RUNNER_TEMP/install-check"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/codeden-*.tgz
          # Pure-JS deps are bundled; only native modules and playwright-core are installed.
          du -sh node_modules
          ls node_modules
          if [ -e node_modules/@anthropic-ai ]; then
            echo "::error::the packed CLI installed @anthropic-ai packages (they should be bundled)"; exit 1
          fi
          npx codeden --version
          export CODEDEN_HOME="$RUNNER_TEMP/codeden-home"
          npx codeden doctor --home "$CODEDEN_HOME" | tee doctor.txt || true
          grep -q "ok  Terminals" doctor.txt
          grep -q "ok  Keychain" doctor.txt || echo "::warning::keychain module did not load"
          # Start it like a user would and check the API and the web UI are served.
          CODEDEN_UPDATE_CHECK=0 npx codeden --home "$CODEDEN_HOME" --port 4791 --no-open > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:4791/api/health > health.json && break
            sleep 1
          done
          cat health.json
          grep -q '"ok":true' health.json
          TOKEN=$(tr -d '\r\n' < "$CODEDEN_HOME/install-token")
          curl -sf -H "cookie: codeden_token_4791=$TOKEN" http://127.0.0.1:4791/ | grep -q "<title>CodeDen"
          curl -sf -H "authorization: Bearer $TOKEN" http://127.0.0.1:4791/api/automations/templates | grep -q security-audit
          npx codeden stop --home "$CODEDEN_HOME" || true
          cat server.log

  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The browser e2e suite runs a real server, runner and PTY; macOS is covered by `check`.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @codeden/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.os }}
          path: apps/web/playwright-report
          retention-days: 7
