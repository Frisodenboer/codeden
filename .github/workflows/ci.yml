name: CI

# Pull requests run unit checks and the browser e2e suite on Linux only: Linux runners start
# at once, while Windows and macOS runners can queue for half an hour or more, which held up
# every merge. Pushes to main, the nightly run and manual runs check Windows and macOS too and
# always run the desktop smoke test, so platform problems still surface within minutes of a
# merge without blocking it. A pull request that changes the desktop app (or this workflow)
# also runs Windows. The `CI result` job at the end is the single check branch protection
# requires.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# A new push to a pull request cancels its older, superseded run. Every push to main gets its
# own group (the run id), so merges in quick succession each get a full run: within one group
# GitHub keeps only the newest pending run and cancels the others even without
# cancel-in-progress.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
      desktop: ${{ steps.detect.outputs.desktop }}
      check-os: ${{ steps.detect.outputs.check-os }}
      e2e-os: ${{ steps.detect.outputs.e2e-os }}
    steps:
      # A pull request is checked out as its merge commit, whose first parent is the base
      # branch: `HEAD^1..HEAD` is exactly what the pull request changes.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: What does this change touch?
        id: detect
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # main, nightly and manual runs: everything, on every OS.
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            echo 'check-os=["windows-latest","macos-latest","ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            echo 'e2e-os=["ubuntu-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          echo "Changed files:"; cat "$RUNNER_TEMP/changed.txt"
          # Documentation: docs/, Markdown files (except the automation templates the server
          # ships) and images outside apps/ and packages/ (app icons and assets are code).
          docs='^docs/|^LICENSE$|^[^/]+\.md$|^(apps|packages)/[^/]+/README\.md$|^apps/runner/src/browser/README\.md$|^[^/]+\.(png|jpe?g|gif|svg|webp)$'
          if [ ! -s "$RUNNER_TEMP/changed.txt" ] || grep -qvE "$docs" "$RUNNER_TEMP/changed.txt"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Documentation-only change: skipping tests and e2e."
          fi
          # The desktop app, or this workflow (so a change to the desktop steps is tested).
          # It also brings in Windows, where most CodeDen desktop users are.
          if grep -qE '^apps/desktop/|^\.github/workflows/ci\.yml$' "$RUNNER_TEMP/changed.txt"; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            echo 'check-os=["windows-latest","ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            echo 'e2e-os=["ubuntu-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
            echo 'check-os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            echo 'e2e-os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  check:
    name: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # About 3 minutes (5 on Windows): fail a hang in minutes instead of waiting for GitHub.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.check-os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Self-update against a local fake registry
        run: pnpm exec vitest run apps/cli/test/self-update.integration.test.ts
        env:
          CODEDEN_REQUIRE_CLI_DIST: "1"
      - name: Install the packed tarball and run it
        shell: bash
        run: |
          cd apps/cli
          npm pack --pack-destination "$RUNNER_TEMP"
          # The Claude Agent SDK is never shipped in the tarball (it is installed on demand).
          # Relative paths: Windows GNU tar reads "D:..." as a remote host.
          mkdir "$RUNNER_TEMP/tarball" && (cd "$RUNNER_TEMP/tarball" && tar xzf ../codeden-*.tgz)
          if grep -rlE "Anthropic PBC|Native CLI binary for" "$RUNNER_TEMP/tarball"; then
            echo "::error::the tarball contains Claude Agent SDK code"; exit 1
          fi
          if grep -q "claude-agent-sdk@" "$RUNNER_TEMP/tarball/package/dist/THIRD-PARTY-NOTICES.txt"; then
            echo "::error::THIRD-PARTY-NOTICES lists the Claude Agent SDK as bundled"; exit 1
          fi
          mkdir "$RUNNER_TEMP/install-check" && cd "$RUNNER_TEMP/install-check"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/codeden-*.tgz
          # Pure-JS deps are bundled; only native modules and playwright-core are installed.
          du -sh node_modules
          ls node_modules
          if [ -e node_modules/@anthropic-ai ]; then
            echo "::error::the packed CLI installed @anthropic-ai packages"; exit 1
          fi
          npx codeden --version
          export CODEDEN_HOME="$RUNNER_TEMP/codeden-home"
          npx codeden doctor --home "$CODEDEN_HOME" | tee doctor.txt || true
          grep -q "ok  Terminals" doctor.txt
          grep -q "ok  Keychain" doctor.txt || echo "::warning::keychain module did not load"
          grep -q -- "--  Claude Code support" doctor.txt
          # On-demand install of Claude Code support, then doctor loads it and checks the version
          # (no real session: CI has no `claude`).
          npx codeden doctor --install --home "$CODEDEN_HOME" | tee doctor-install.txt || true
          grep -q "ok  Claude Code support  SDK " doctor-install.txt
          du -sh "$CODEDEN_HOME/deps"
          ls "$CODEDEN_HOME/deps/node_modules/@anthropic-ai"
          if [ "$(ls "$CODEDEN_HOME/deps/node_modules/@anthropic-ai")" != "claude-agent-sdk" ]; then
            echo "::error::on-demand install added platform binaries or peers"; exit 1
          fi
          # Start it like a user would and check the API and the web UI are served.
          CODEDEN_UPDATE_CHECK=0 npx codeden --home "$CODEDEN_HOME" --port 4791 --no-open > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:4791/api/health > health.json && break
            sleep 1
          done
          cat health.json
          grep -q '"ok":true' health.json
          TOKEN=$(tr -d '\r\n' < "$CODEDEN_HOME/install-token")
          curl -sf -H "cookie: codeden_token_4791=$TOKEN" http://127.0.0.1:4791/ | grep -q "<title>CodeDen"
          curl -sf -H "authorization: Bearer $TOKEN" http://127.0.0.1:4791/api/automations/templates | grep -q security-audit
          npx codeden stop --home "$CODEDEN_HOME" || true
          cat server.log

  e2e:
    name: e2e (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # About 3 minutes with a warm browser cache (5 on Windows): fail a hang in minutes.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The browser e2e suite runs a real server, runner and PTY; macOS is covered by `check`.
        os: ${{ fromJSON(needs.changes.outputs.e2e-os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Playwright's browsers and the Electron binary live outside node_modules, so the pnpm
      # cache does not cover them. They are cached per OS and version.
      - name: Resolve the Playwright and Electron versions
        id: versions
        shell: bash
        run: |
          echo "playwright=$(pnpm --filter @codeden/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          cd apps/desktop
          echo "electron=$(node -p 'require("electron/package.json").version')-builder-$(node -p 'require("electron-builder/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Restore the Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.playwright }}
      # On Linux a cache miss also installs Chromium's shared libraries from apt. On Windows,
      # `--with-deps` only adds the Media Foundation feature (about 3 minutes), which the suite
      # does not need.
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            pnpm --filter @codeden/web exec playwright install --with-deps chromium
          else
            pnpm --filter @codeden/web exec playwright install chromium
          fi
      # Saved straight away, so a failing test run still fills the cache for the next one.
      - name: Save the Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\ms-playwright' || '~/.cache/ms-playwright' }}
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
      # The runner image already has the libraries Chromium needs; install them only if one
      # is missing (a changed image), instead of running apt on every cache hit.
      - name: Check Chromium's system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          missing=$(find ~/.cache/ms-playwright -type f \( -name chrome -o -name chrome-headless-shell \) \
            -exec ldd {} \; | grep "not found" || true)
          if [ -n "$missing" ]; then
            echo "::warning::Chromium is missing system libraries; installing them"
            echo "$missing"
            pnpm --filter @codeden/web exec playwright install-deps chromium
          fi
      - run: pnpm e2e
      # The desktop smoke test packages and launches the Electron app: on main, nightly and
      # manual runs, and on pull requests that change apps/desktop (see `changes`).
      # Packaging downloads the Electron binary (and, on Windows, electron-builder's icon tools)
      # from GitHub releases, which can fail with a 504; a cache hit needs no download.
      - name: Restore the Electron downloads
        id: electron-cache
        if: needs.changes.outputs.desktop == 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.os == 'Windows' && '~\AppData\Local\electron\Cache' || '~/.cache/electron' }}
            ${{ runner.os == 'Windows' && '~\AppData\Local\electron-builder\Cache' || '~/.cache/electron-builder' }}
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.electron }}
      # On a cache miss a GitHub 5xx or network error is retried four times (30, 60, 90 and
      # 120 s later); any other failure fails at once.
      - name: Package the desktop app (unpacked build)
        id: package
        if: needs.changes.outputs.desktop == 'true'
        shell: bash
        env:
          # Logs "Cache hit" or "Cache miss" (and the URL) for every Electron download.
          DEBUG: "@electron/get:index"
        run: |
          for attempt in 1 2 3 4 5; do
            if pnpm --filter @codeden/desktop package --dir 2>&1 | tee "$RUNNER_TEMP/package.log"; then
              exit 0
            fi
            if [ "$attempt" = 5 ] || ! grep -qE "HTTPError: Response code 5[0-9][0-9]|ETIMEDOUT|ECONNRESET|EAI_AGAIN" "$RUNNER_TEMP/package.log"; then
              exit 1
            fi
            echo "::warning::A download from GitHub failed (attempt $attempt of 5); retrying in $((attempt * 30)) s"
            sleep $((attempt * 30))
          done
      # Only after a successful packaging run, so a half-finished download is never saved.
      - name: Save the Electron downloads
        if: needs.changes.outputs.desktop == 'true' && steps.electron-cache.outputs.cache-hit != 'true' && steps.package.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.os == 'Windows' && '~\AppData\Local\electron\Cache' || '~/.cache/electron' }}
            ${{ runner.os == 'Windows' && '~\AppData\Local\electron-builder\Cache' || '~/.cache/electron-builder' }}
          key: ${{ steps.electron-cache.outputs.cache-primary-key }}
      - name: Desktop app smoke test (unpacked build)
        if: needs.changes.outputs.desktop == 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a pnpm --filter @codeden/desktop e2e
          else
            pnpm --filter @codeden/desktop e2e
          fi
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.os }}
          path: apps/web/playwright-report
          retention-days: 7

  # The one check to require in branch protection: green when every job passed, or was skipped
  # because the change only touches documentation.
  result:
    name: CI result
    needs: [changes, check, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required job passed or was skipped by change detection
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          CHECK: ${{ needs.check.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "changes: $CHANGES (code: $CODE), check: $CHECK, e2e: $E2E"
          if [ "$CHANGES" != "success" ]; then
            echo "::error::Change detection did not succeed"; exit 1
          fi
          for result in "$CHECK" "$E2E"; do
            if [ "$result" = "success" ]; then continue; fi
            if [ "$result" = "skipped" ] && [ "$CODE" = "false" ]; then continue; fi
            echo "::error::A required job did not pass (check: $CHECK, e2e: $E2E)"; exit 1
          done
