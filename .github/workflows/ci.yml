name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Self-update against a local fake registry
        run: pnpm exec vitest run apps/cli/test/self-update.integration.test.ts
        env:
          CODEDEN_REQUIRE_CLI_DIST: "1"
      - name: Install the packed tarball and run it
        shell: bash
        run: |
          cd apps/cli
          npm pack --pack-destination "$RUNNER_TEMP"
          # The Claude Agent SDK is never shipped in the tarball (it is installed on demand).
          # Relative paths: Windows GNU tar reads "D:..." as a remote host.
          mkdir "$RUNNER_TEMP/tarball" && (cd "$RUNNER_TEMP/tarball" && tar xzf ../codeden-*.tgz)
          if grep -rlE "Anthropic PBC|Native CLI binary for" "$RUNNER_TEMP/tarball"; then
            echo "::error::the tarball contains Claude Agent SDK code"; exit 1
          fi
          if grep -q "claude-agent-sdk@" "$RUNNER_TEMP/tarball/package/dist/THIRD-PARTY-NOTICES.txt"; then
            echo "::error::THIRD-PARTY-NOTICES lists the Claude Agent SDK as bundled"; exit 1
          fi
          mkdir "$RUNNER_TEMP/install-check" && cd "$RUNNER_TEMP/install-check"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/codeden-*.tgz
          # Pure-JS deps are bundled; only native modules and playwright-core are installed.
          du -sh node_modules
          ls node_modules
          if [ -e node_modules/@anthropic-ai ]; then
            echo "::error::the packed CLI installed @anthropic-ai packages"; exit 1
          fi
          npx codeden --version
          export CODEDEN_HOME="$RUNNER_TEMP/codeden-home"
          npx codeden doctor --home "$CODEDEN_HOME" | tee doctor.txt || true
          grep -q "ok  Terminals" doctor.txt
          grep -q "ok  Keychain" doctor.txt || echo "::warning::keychain module did not load"
          grep -q -- "--  Claude Code support" doctor.txt
          # On-demand install of Claude Code support, then doctor loads it and checks the version
          # (no real session: CI has no `claude`).
          npx codeden doctor --install --home "$CODEDEN_HOME" | tee doctor-install.txt || true
          grep -q "ok  Claude Code support  SDK " doctor-install.txt
          du -sh "$CODEDEN_HOME/deps"
          ls "$CODEDEN_HOME/deps/node_modules/@anthropic-ai"
          if [ "$(ls "$CODEDEN_HOME/deps/node_modules/@anthropic-ai")" != "claude-agent-sdk" ]; then
            echo "::error::on-demand install added platform binaries or peers"; exit 1
          fi
          # Start it like a user would and check the API and the web UI are served.
          CODEDEN_UPDATE_CHECK=0 npx codeden --home "$CODEDEN_HOME" --port 4791 --no-open > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:4791/api/health > health.json && break
            sleep 1
          done
          cat health.json
          grep -q '"ok":true' health.json
          TOKEN=$(tr -d '\r\n' < "$CODEDEN_HOME/install-token")
          curl -sf -H "cookie: codeden_token_4791=$TOKEN" http://127.0.0.1:4791/ | grep -q "<title>CodeDen"
          curl -sf -H "authorization: Bearer $TOKEN" http://127.0.0.1:4791/api/automations/templates | grep -q security-audit
          npx codeden stop --home "$CODEDEN_HOME" || true
          cat server.log

  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The browser e2e suite runs a real server, runner and PTY; macOS is covered by `check`.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @codeden/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      # The desktop smoke test packages and launches the Electron app. Run it on main and
      # on pull requests that change the desktop app; other PRs don't need the download.
      - name: Does this change touch the desktop app?
        id: desktop
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          if git diff --name-only FETCH_HEAD HEAD | grep -qE '^apps/desktop/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No desktop changes: skipping the desktop smoke test."
          fi
      # Electron fetches its ~100 MB binary from GitHub releases on first use. Cache it per
      # version and OS, and retry transient network errors (GitHub has returned 504s).
      - name: Cache the Electron binary
        if: steps.desktop.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-
      - name: Download the Electron binary (with retries)
        if: steps.desktop.outputs.run == 'true'
        shell: bash
        working-directory: apps/desktop
        run: |
          for attempt in 1 2 3 4 5; do
            if node -e "require('electron')" > /dev/null; then exit 0; fi
            echo "::warning::Electron download failed (attempt $attempt of 5); retrying"
            sleep $((attempt * 30))
          done
          exit 1
      - name: Desktop app smoke test (unpacked build)
        if: steps.desktop.outputs.run == 'true'
        shell: bash
        run: |
          pnpm --filter @codeden/desktop package --dir
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a pnpm --filter @codeden/desktop e2e
          else
            pnpm --filter @codeden/desktop e2e
          fi
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.os }}
          path: apps/web/playwright-report
          retention-days: 7
