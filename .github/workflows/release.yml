name: Release

on:
  push:
    tags: ["v*.*.*"]
  # Actions > Release > Run workflow (on main): pick patch, minor or major and the workflow
  # bumps the version, runs the checks, commits and tags it, and publishes. "dry-run" builds
  # and packs only, with no version change, npm publish or GitHub Release.
  workflow_dispatch:
    inputs:
      release:
        description: Version bump (dry-run builds and packs only)
        type: choice
        options: [patch, minor, major, dry-run]
        default: patch

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.release == 'dry-run' }}
      # patch, minor or major on a manual run; empty for a pushed tag and for a dry run.
      BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.release != 'dry-run' && inputs.release || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # Bumped before the checks and the build, so they run against the version being
      # released. Nothing is pushed until they pass (see "Commit and tag the version").
      - name: Bump the version
        id: bump
        if: env.BUMP != ''
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run the release from main (got $GITHUB_REF_NAME)"; exit 1
          fi
          version=$(node scripts/release/bump-version.mjs "$BUMP")
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version already exists"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Bumping to $version ($BUMP)"
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      - name: Check the tag matches the package version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./apps/cli/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$BUMP" ]; then
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match apps/cli/package.json version $version"
              exit 1
            fi
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [ "$DRY_RUN" != "true" ]; then
            echo "::error::A real release must run on a v*.*.* tag (got $GITHUB_REF_TYPE $GITHUB_REF_NAME)"
            exit 1
          fi
          echo "Releasing codeden $version (dry run: $DRY_RUN)"

      # One atomic push of the bump commit and its tag, only after the checks passed. Pushes
      # made with the workflow token don't start other workflows, so this run carries on with
      # the release itself instead of a second run starting from the tag.
      - name: Commit and tag the version
        if: env.BUMP != ''
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cli/package.json apps/desktop/package.json packages/contracts/src/version.ts CHANGELOG.md
          git commit -m "chore(release): $VERSION"
          git tag "v$VERSION"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$VERSION"

      - name: Pack
        id: pack
        shell: bash
        working-directory: apps/cli
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          echo "tarball=$RUNNER_TEMP/codeden-${{ steps.version.outputs.version }}.tgz" >> "$GITHUB_OUTPUT"

      # Authenticates with npm Trusted Publishing (OIDC): the package's npm settings trust
      # leonvanzyl/codeden + release.yml, so no token secret is needed. Requires npm >= 11.5.1.
      - name: Publish to npm (trusted publishing)
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          npm install -g npm@latest
          npm --version
          npm publish "${{ steps.pack.outputs.tarball }}" --provenance --access public

      # Created as a draft: the desktop jobs attach their installers and update files
      # (latest*.yml) to it, and `publish` makes it public only once all of them are there.
      # Desktop apps read the latest *published* release, so they never see a release
      # without its update files (which they used to report as a 404).
      - name: Create the GitHub Release (draft)
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" "${{ steps.pack.outputs.tarball }}" \
            --title "codeden ${{ steps.version.outputs.version }}" \
            --generate-notes --verify-tag --draft

      - name: Upload the packed tarball (dry run)
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codeden-${{ steps.version.outputs.version }}
          path: ${{ steps.pack.outputs.tarball }}

  # The desktop app (docs/desktop.md): installers plus the update metadata the app reads
  # (latest.yml, latest-mac.yml, latest-linux.yml, blockmaps), attached to the same GitHub
  # Release. Signing is optional: without the secrets the builds are unsigned.
  desktop:
    name: desktop (${{ matrix.os }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.release == 'dry-run' }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      # The release's tag (the bump commit on a manual run); the run's own ref on a dry run.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Check the desktop version matches the CLI
        shell: bash
        run: |
          cli=$(node -p "require('./apps/cli/package.json').version")
          desktop=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$cli" != "$desktop" ]; then
            echo "::error::apps/desktop is $desktop but apps/cli is $cli"; exit 1
          fi

      # Electron fetches its ~100 MB binary from GitHub releases on first use. Cache it per
      # version and OS, and retry transient network errors (GitHub has returned 504s).
      - name: Cache the Electron binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-
      - name: Download the Electron binary (with retries)
        shell: bash
        working-directory: apps/desktop
        run: |
          for attempt in 1 2 3 4 5; do
            if node -e "require('electron')" > /dev/null; then exit 0; fi
            echo "::warning::Electron download failed (attempt $attempt of 5); retrying"
            sleep $((attempt * 30))
          done
          exit 1
      - name: Build the installers
        shell: bash
        env:
          # Windows (.pfx) or macOS (Developer ID .p12) certificate, base64 or a URL.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # macOS notarization.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Unset empty secrets so electron-builder treats the build as unsigned.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -z "${!v}" ] && unset "$v"
          done
          if [ "$RUNNER_OS" = "macOS" ]; then
            pnpm --filter @codeden/desktop package --arch arm64 --arch x64
          else
            pnpm --filter @codeden/desktop package
          fi
          ls -la apps/desktop/release

      - name: Collect the release files
        id: files
        shell: bash
        run: |
          shopt -s nullglob
          cd apps/desktop/release
          files=(*.exe *.dmg *.zip *.AppImage *.deb *.blockmap latest*.yml)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::no installers were built"; exit 1; fi
          printf '%s\n' "${files[@]}"
          mkdir -p "$RUNNER_TEMP/desktop" && cp "${files[@]}" "$RUNNER_TEMP/desktop/"
          echo "dir=$RUNNER_TEMP/desktop" >> "$GITHUB_OUTPUT"

      - name: Attach to the GitHub Release
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "${{ steps.files.outputs.dir }}"/* --clobber

      - name: Upload the installers (dry run)
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codeden-desktop-${{ matrix.os }}
          path: ${{ steps.files.outputs.dir }}

  # Publish the release once every desktop build is attached. If a desktop job fails, the
  # release stays a draft (npm is already published); re-run the failed job, and this job
  # publishes it once everything has succeeded.
  publish:
    name: Publish the GitHub Release
    needs: [release, desktop]
    if: github.event_name != 'workflow_dispatch' || inputs.release != 'dry-run'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release and mark it latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets --jq '"draft=\(.isDraft) assets=\(.assets | length)"'
